[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cheon-embedding"
dynamic = ["version"]
description = "Cheon Embedding (체온 임베딩): multilingual text embeddings for search and RAG, with a cookbook of runnable recipes."
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [{ name = "CHEON:AI", email = "hello@cheon.ai.kr" }]
keywords = ["embeddings", "text-embedding", "semantic-search", "rag", "information-retrieval", "cookbook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.56",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://cheon.ai.kr"
Model = "https://huggingface.co/cheonai/cheon-embedding-0.6b-v1"
Repository = "https://github.com/cheon-ai-official/cheon-embedding"

# The modules sit directly in src/; installed, they are the cheon_embedding package.
[tool.setuptools]
package-dir = { cheon_embedding = "src" }
packages = ["cheon_embedding"]

[tool.setuptools.dynamic]
version = { attr = "cheon_embedding.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cheon_embedding"]
